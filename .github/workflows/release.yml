name: Release builds

# v0.5.0 §release: tag-driven release automation. Pushing a `v*` tag builds
# the Android splits (v7a/v8a), the universal APK and the Windows zip, then
# attaches everything to the GitHub Release for that tag.
#
# Android signing: the release keystore + key.properties are injected from
# repository SECRETS (ANDROID_KEYSTORE_BASE64 = the .jks file, base64;
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEYSTORE_ALIAS as plain strings).
# Without the secrets the build falls back to the debug key (the gradle
# config already supports that) — artifacts still attach, they just carry
# the dev signature.
#
# Windows: no code-signing cert is wired yet, so SmartScreen may warn on
# first run ("More info → Run anyway") — noted in the release body.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (version pinned to the dev toolchain)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Restore release keystore from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/atlanhix-release.jks
            cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=$KS_ALIAS
          storeFile=atlanhix-release.jks
          EOF
            echo "keystore restored from secrets"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret — debug-signed fallback"
          fi

      - name: Build split APKs (v7a + v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # v0.6.14 §packaging-fix: the universal APK MUST carry a Flutter engine
      # for every ABI its manifest advertises. libbox.aar ships an x86_64
      # .so, so the manifest said `native-code: arm64-v8a armeabi-v7a x86_64`
      # while the build only produced ARM engines — the file then INSTALLS on
      # an x86_64 device and dies on launch with
      #   UnsatisfiedLinkError: libflutter.so is for EM_AARCH64 instead of
      #   EM_X86_64   (reproduced on an Android 15 x86_64 emulator).
      - name: Build universal APK (arm + arm64 + x64 engines)
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Rename artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk      "dist/atlanhix-v$VER-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk   "dist/atlanhix-v$VER-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk               "dist/atlanhix-v$VER-universal.apk"
          ls -la dist

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true

  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (version pinned to the dev toolchain)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Download core engines (official releases)
        # v0.6.3 §ci-fix: engine downloads must never cost the whole release.
        # This step is what silently killed the Windows job on v0.6.0, v0.6.1
        # AND v0.6.3 — Android published its APKs, the Windows zip never did,
        # so desktop users had NO update asset to download at all (the exact
        # "آپدیت درون‌برنامه‌ای کار نمی‌کند" report). Two changes: every download
        # retries through curl.exe, and a missing engine is now a loud warning
        # instead of a dead job — the zip still ships and every existing
        # install can finally self-update.
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path cores/windows-x64 | Out-Null
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o sb.zip 'https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-windows-amd64.zip'
          if (-not (Test-Path sb.zip)) { throw 'sing-box download failed (curl)' }
          Expand-Archive sb.zip -DestinationPath sb -Force
          # archive layouts differ (sing-box nests a version dir, Xray puts
          # the exe at the ROOT) — search recursively instead of guessing.
          # v0.6.12 §ci-fix: if the expected name is absent, fall back to
          # whatever exe the archive carries and NORMALIZE it, instead of
          # dereferencing a $null and copying nothing.
          $sbExe = Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $sbExe) { $sbExe = Get-ChildItem sb -Recurse -Filter *.exe | Select-Object -First 1 }
          if (-not $sbExe) { throw 'no sing-box executable inside the archive' }
          Copy-Item $sbExe.FullName cores/windows-x64/sing-box.exe -Force
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o xr.zip 'https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip'
          if (-not (Test-Path xr.zip)) { throw 'xray download failed (curl)' }
          Expand-Archive xr.zip -DestinationPath xr -Force
          $xrExe = Get-ChildItem xr -Recurse -Filter xray.exe | Select-Object -First 1
          if (-not $xrExe) { $xrExe = Get-ChildItem xr -Recurse -Filter *.exe | Select-Object -First 1 }
          if (-not $xrExe) { throw 'no xray executable inside the archive' }
          Copy-Item $xrExe.FullName cores/windows-x64/xray.exe -Force
          # v0.5.3: mihomo (Clash.Meta) — the third standalone engine.
          #
          # v0.5.6 §ci-fix: this step is what killed the Windows job on
          # v0.5.4, v0.5.5 and v0.5.6 — the pinned asset
          # `mihomo-windows-amd64-v1.19.31.gz` returns 404, because MetaCubeX
          # ships .zip archives (and only started tagging v1.19.32 here), not
          # a bare .gz. The whole release failed at this one step while
          # Android succeeded, so the APKs published but the Windows zip
          # never did. Now: resolve the latest release's asset by NAME
          # pattern instead of pinning a URL, so a new upstream tag cannot
          # break the build again.
          #
          # v0.6.3 §ci-fix: that pattern was a trap in the other direction —
          # it matched ONLY the `-v1-v1.19.32` microarch shape, so it would
          # have shipped the v1 build (the one that can SIGILL on older CPUs)
          # and would break outright on any release carrying just the plain
          # asset. Match the plain Go-toolchain build (`-v1-`/`-v2-`/`-v3-`
          # are microarch-specific and stay out of the pick).
          # v0.6.3 §ci-fix: authenticate this call. api.github.com allows only
          # 60 unauthenticated requests per hour PER IP and runner IPs are
          # shared, so this line is a time bomb on its own; github.token lifts
          # the budget to 5000/hour. (The DOWNLOADS below were the actual
          # killer — replacing the one-shot Invoke-WebRequest with the
          # retrying curl call is what turned this step green.)
          # v0.6.12 §ci-fix (root cause of `mihomo.exe not found inside the
          # release archive`): MetaCubeX v1.19.32 ships the binary INSIDE the
          # zip as `mihomo-windows-amd64.exe`, so `-Filter mihomo.exe`
          # matched nothing, this step threw, `continue-on-error` swallowed
          # it — and v0.6.9/v0.6.10/v0.6.11 all published a Windows zip with
          # NO mihomo.exe while the job stayed green. mihomo is the DEFAULT
          # engine, so those installs could not connect. Now: take
          # mihomo.exe when it exists, otherwise rename whatever exe upstream
          # used (the app also accepts the `mihomo-windows-amd64.exe`
          # alias, but normalizing keeps BinaryManager's first candidate
          # hit). Resolution failure falls back to a PINNED asset URL so a
          # flaky api.github.com can never cost the default engine.
          $mhUrl = $null
          try {
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' -Headers @{ 'User-Agent' = 'atlanhix-release'; 'Authorization' = 'Bearer ${{ github.token }}' }
            $asset = $rel.assets |
              Where-Object { $_.name -match '^mihomo-windows-amd64-v\d+\.\d+\.\d+\.zip$' } |
              Select-Object -First 1
            if ($asset) { $mhUrl = $asset.browser_download_url; Write-Output "mihomo $($rel.tag_name) -> $($asset.name)" }
          } catch { Write-Warning "mihomo release lookup failed: $($_.Exception.Message)" }
          if (-not $mhUrl) {
            Write-Warning 'no mihomo windows-amd64 asset resolved — pinned fallback'
            $mhUrl = 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-windows-amd64-v1.19.32.zip'
          }
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o mh.zip $mhUrl
          if (-not (Test-Path mh.zip)) { throw 'mihomo download failed (curl)' }
          New-Item -ItemType Directory -Force -Path mh | Out-Null
          Expand-Archive mh.zip -DestinationPath mh -Force
          # Archive layouts vary (some nest a version dir, some rename the
          # binary) — search the whole tree, never assume a single layout.
          $mhExe = Get-ChildItem mh -Recurse -Filter mihomo.exe | Select-Object -First 1
          if (-not $mhExe) {
            $mhExe = Get-ChildItem mh -Recurse -Filter *.exe |
              Where-Object { $_.Name -notmatch 'unins|setup|install' } |
              Select-Object -First 1
          }
          if (-not $mhExe) { throw 'no executable inside the mihomo archive' }
          Copy-Item $mhExe.FullName cores/windows-x64/mihomo.exe -Force
          Write-Output "mihomo.exe <= $($mhExe.FullName)"
          # v0.6.12 §windows-tun: sing-box dlopen()s `wintun.dll` when the
          # config carries a tun inbound, and the upstream Windows archive
          # ships NO such file — so even an elevated user would hit a missing
          # module the moment TUN is selected. Pin the official build
          # (wintun.net/builds/wintun-0.14.1.zip — verified live) and drop it
          # NEXT TO sing-box.exe, which is where wintun's own instructions
          # say it must live.
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o wt.zip 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          if (-not (Test-Path wt.zip)) { throw 'wintun download failed (curl)' }
          New-Item -ItemType Directory -Force -Path wt | Out-Null
          Expand-Archive wt.zip -DestinationPath wt -Force
          # archive is wintun/bin/<arch>/wintun.dll — take AMD64, never x86.
          # v0.6.12 §ci-fix: this ran through a `[\/]amd64[\/]` regex first
          # and matched NOTHING in PowerShell (proven locally: 4 DLLs found,
          # 0 regex hits), so the step died before copying. Exact layout path
          # first, wildcard search second — no backslash regex either way.
          $wtDll = $null
          $wtExact = Join-Path wt 'wintun\bin\amd64\wintun.dll'
          if (Test-Path $wtExact) {
            $wtDll = Get-Item $wtExact
          } else {
            $wtDll = Get-ChildItem wt -Recurse -Filter wintun.dll |
              Where-Object { $_.FullName -like '*amd64*' } |
              Select-Object -First 1
          }
          if (-not $wtDll) { throw 'amd64 wintun.dll not found inside the archive' }
          Copy-Item $wtDll.FullName cores/windows-x64/wintun.dll -Force
          Get-ChildItem cores/windows-x64

      - name: Verify bundled engines
        # v0.6.12 §ci-fix: the download step above is continue-on-error by
        # DESIGN (a third-party outage must not cost the release), which is
        # precisely how three releases shipped a Windows zip without the
        # default engine and nobody noticed. A bundle with a missing engine
        # is not a working release — the zip must not be published in that
        # state, so this check is FATAL. The extraction above is name-robust
        # and pinned-fallback, so the only way to land here is a genuine
        # upstream outage: fix the network and re-run the tag.
        shell: pwsh
        run: |
          Get-ChildItem cores/windows-x64
          $missing = @()
          foreach ($e in 'sing-box.exe','xray.exe','mihomo.exe','wintun.dll') {
            if (-not (Test-Path "cores/windows-x64/$e")) { $missing += $e }
          }
          if ($missing.Count -gt 0) {
            throw "missing engines in the Windows bundle: $($missing -join ', ')"
          }
          Write-Output 'all engines present'

      - name: Stage + zip
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $stage = "stage/Atlanhix-v$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/windows/x64/runner/Release/* $stage -Recurse -Force
          # engines ride INSIDE the bundle so a zip-only install just works
          # (BinaryManager searches ./cores relative to the working dir)
          if (Test-Path cores) {
            Copy-Item cores $stage -Recurse -Force
          } else {
            Write-Warning 'no cores/ dir — shipping the zip without bundled engines'
          }
          Compress-Archive -Path $stage -DestinationPath "Atlanhix-v$ver-windows-x64.zip" -Force
          Get-Item "Atlanhix-v$ver-windows-x64.zip" | Select-Object Name, Length

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Atlanhix-*-windows-x64.zip
          fail_on_unmatched_files: true

  # v0.6.3 §release-parity: Linux is a first-class desktop target now — the
  # same bundle layout as Windows (app + cores/<platform>-<arch>), zipped as
  # a .tar.gz. The Dart side picks it up automatically: UpdateChecker resolves
  # Atlanhix-v*-linux-x64.tar.gz for TargetPlatform.linux, the in-app updater
  # streams it into ~/Downloads and reveals it in the file manager, and
  # BinaryManager looks in cores/linux-x64 (Platform.operatingSystem+arch).
  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libjsoncpp-dev
          # tray_manager/window_manager need an appindicator dev package; the
          # name differs across Ubuntu releases (ayatana on 22.04+/24.04).
          sudo apt-get install -y libayatana-appindicator3-dev || \
            sudo apt-get install -y libappindicator3-dev || true

      - name: Set up Flutter (version pinned to the dev toolchain)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Download core engines (official releases)
        # v0.6.3 §ci-fix: same policy as the Windows job — a missing engine
        # warns loudly and the tarball still ships, and the mihomo API call
        # rides github.token (60 unauthenticated calls/hour/IP on shared
        # runner IPs is not a budget a release should depend on).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cores/linux-x64 tmp-cores
          # sing-box (same pinned version as the Windows job)
          curl -fsSL -o tmp-cores/sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar -xzf tmp-cores/sb.tar.gz -C tmp-cores
          # v0.6.12 §ci-fix: an empty find result used to make `cp "" dest`
          # die with a bare cp error — say WHICH engine vanished instead.
          sb="$(find tmp-cores -type f -name sing-box | head -n1)"
          if [ -z "$sb" ]; then echo 'sing-box binary missing after extraction' >&2; exit 1; fi
          cp "$sb" cores/linux-x64/sing-box
          # Xray
          curl -fsSL -o tmp-cores/xr.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          unzip -o -q tmp-cores/xr.zip -d tmp-cores/xr
          xr="$(find tmp-cores/xr -type f -name xray | head -n1)"
          if [ -z "$xr" ]; then echo 'xray binary missing after extraction' >&2; exit 1; fi
          cp "$xr" cores/linux-x64/xray
          # mihomo — resolve the newest asset by NAME (never a pinned URL: the
          # Windows job learned that lesson in v0.5.6) and accept either the
          # .zip or the .gz packaging upstream switches between.
          # Optional bearer so this curl never meets the 60/hour wall (the
          # header is skipped entirely when the token is absent).
          auth=()
          if [ -n "$GH_TOKEN" ]; then auth=(-H "Authorization: Bearer $GH_TOKEN"); fi
          assets="$(curl -fsSL -H 'User-Agent: atlanhix-release' "${auth[@]}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          url="$(printf '%s' "$assets" | \
            grep -o 'https://[^"]*mihomo-linux-amd64-v[0-9.]*\.\(zip\|gz\)' | head -n1)"
          if [ -z "$url" ]; then
            # v0.6.12 §ci-fix: same lesson as the Windows job — resolution
            # failure must not cost the DEFAULT engine. Pinned, verified-live
            # asset so a rate-limited api.github.com still ships a working
            # tarball.
            echo 'no mihomo linux-amd64 asset resolved — pinned fallback' >&2
            url='https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz'
          fi
          echo "mihomo -> $url"
          case "$url" in
            *.zip)
              curl -fsSL -o tmp-cores/mh.zip "$url"
              unzip -o -q tmp-cores/mh.zip -d tmp-cores/mh
              ;;
            *.gz)
              curl -fsSL -o tmp-cores/mihomo.gz "$url"
              gunzip -f tmp-cores/mihomo.gz
              mkdir -p tmp-cores/mh
              mv tmp-cores/mihomo tmp-cores/mh/mihomo
              ;;
          esac
          # v0.6.12 §ci-fix: the binary inside the archive is not always
          # literally named `mihomo` (upstream ships mihomo-linux-amd64-*),
          # so accept any mihomo* file and NORMALIZE it to cores/mihomo.
          mhbin="$(find tmp-cores/mh -type f \( -name mihomo -o -name 'mihomo-*' \) | head -n1)"
          if [ -z "$mhbin" ]; then echo 'no mihomo binary inside the archive' >&2; exit 1; fi
          cp "$mhbin" cores/linux-x64/mihomo
          chmod +x cores/linux-x64/*
          ls -la cores/linux-x64

      - name: Verify bundled engines
        # v0.6.12 §ci-fix: the download step is continue-on-error by DESIGN
        # (a third-party outage must not cost the release) — which is how a
        # bundle can silently ship WITHOUT its engines while the job stays
        # green. A tarball missing the default engine is not a working
        # release, so this check is FATAL.
        run: |
          set -euo pipefail
          ls -la cores/linux-x64
          missing=()
          for e in sing-box xray mihomo; do
            [ -f "cores/linux-x64/$e" ] || missing+=("$e")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "missing engines in the Linux bundle: ${missing[*]}" >&2
            exit 1
          fi
          echo 'all engines present'

      - name: Stage + tarball
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="stage/Atlanhix-v$VER"
          mkdir -p "$STAGE"
          cp -r build/linux/x64/release/bundle/. "$STAGE/"
          # engines ride INSIDE the bundle so an untar-only install just works
          if [ -d cores ]; then
            cp -r cores "$STAGE/"
          else
            echo '::warning::no cores/ dir — shipping the tarball without bundled engines'
          fi
          tar -czf "Atlanhix-v$VER-linux-x64.tar.gz" -C stage "Atlanhix-v$VER"
          ls -la Atlanhix-*-linux-x64.tar.gz

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Atlanhix-*-linux-x64.tar.gz
          fail_on_unmatched_files: true
