name: Release builds

# v0.5.0 §release: tag-driven release automation. Pushing a `v*` tag builds
# the Android splits (v7a/v8a), the universal APK and the Windows zip, then
# attaches everything to the GitHub Release for that tag.
#
# Android signing: the release keystore + key.properties are injected from
# repository SECRETS (ANDROID_KEYSTORE_BASE64 = the .jks file, base64;
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEYSTORE_ALIAS as plain strings).
# Without the secrets the build falls back to the debug key (the gradle
# config already supports that) — artifacts still attach, they just carry
# the dev signature.
#
# Windows: no code-signing cert is wired yet, so SmartScreen may warn on
# first run ("More info → Run anyway") — noted in the release body.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (version pinned to the dev toolchain)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Restore release keystore from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/atlanhix-release.jks
            cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$KS_PASS
          keyAlias=$KS_ALIAS
          storeFile=atlanhix-release.jks
          EOF
            echo "keystore restored from secrets"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret — debug-signed fallback"
          fi

      - name: Build split APKs (v7a + v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Build universal APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Rename artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk      "dist/atlanhix-v$VER-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk   "dist/atlanhix-v$VER-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk               "dist/atlanhix-v$VER-universal.apk"
          ls -la dist

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true

  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (version pinned to the dev toolchain)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Download core engines (official releases)
        # v0.6.3 §ci-fix: engine downloads must never cost the whole release.
        # This step is what silently killed the Windows job on v0.6.0, v0.6.1
        # AND v0.6.3 — Android published its APKs, the Windows zip never did,
        # so desktop users had NO update asset to download at all (the exact
        # "آپدیت درون‌برنامه‌ای کار نمی‌کند" report). Two changes: every download
        # retries through curl.exe, and a missing engine is now a loud warning
        # instead of a dead job — the zip still ships and every existing
        # install can finally self-update.
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path cores/windows-x64 | Out-Null
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o sb.zip 'https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-windows-amd64.zip'
          if (-not (Test-Path sb.zip)) { throw 'sing-box download failed (curl)' }
          Expand-Archive sb.zip -DestinationPath sb -Force
          # archive layouts differ (sing-box nests a version dir, Xray puts
          # the exe at the ROOT) — search recursively instead of guessing.
          $sbExe = Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1
          Copy-Item $sbExe.FullName cores/windows-x64/sing-box.exe
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o xr.zip 'https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip'
          if (-not (Test-Path xr.zip)) { throw 'xray download failed (curl)' }
          Expand-Archive xr.zip -DestinationPath xr -Force
          $xrExe = Get-ChildItem xr -Recurse -Filter xray.exe | Select-Object -First 1
          Copy-Item $xrExe.FullName cores/windows-x64/xray.exe
          # v0.5.3: mihomo (Clash.Meta) — the third standalone engine.
          #
          # v0.5.6 §ci-fix: this step is what killed the Windows job on
          # v0.5.4, v0.5.5 and v0.5.6 — the pinned asset
          # `mihomo-windows-amd64-v1.19.31.gz` returns 404, because MetaCubeX
          # ships .zip archives (and only started tagging v1.19.32 here), not
          # a bare .gz. The whole release failed at this one step while
          # Android succeeded, so the APKs published but the Windows zip
          # never did. Now: resolve the latest release's asset by NAME
          # pattern instead of pinning a URL, so a new upstream tag cannot
          # break the build again.
          #
          # v0.6.3 §ci-fix: the v0.5.6 fix then over-corrected — it demanded the
          # `-v1-v1.19.32` microarch shape, so the PLAIN asset that upstream
          # has always shipped (`mihomo-windows-amd64-v1.19.32.zip`) matched
          # nothing and the throw killed the release again. Match the plain
          # Go-toolchain build (the portable one): the `-v1-`/`-v2-` builds
          # can SIGILL on older CPUs.
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' -Headers @{ 'User-Agent' = 'atlanhix-release' }
          $asset = $rel.assets |
            Where-Object { $_.name -match '^mihomo-windows-amd64-v\d+\.\d+\.\d+\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw "no mihomo windows-amd64 asset in $($rel.tag_name)" }
          Write-Output "mihomo $($rel.tag_name) -> $($asset.name)"
          & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o mh.zip $asset.browser_download_url
          if (-not (Test-Path mh.zip)) { throw 'mihomo download failed (curl)' }
          New-Item -ItemType Directory -Force -Path mh | Out-Null
          Expand-Archive mh.zip -DestinationPath mh -Force
          # Archive layouts vary (some nest a version dir) — search, don't guess.
          $mhExe = Get-ChildItem mh -Recurse -Filter mihomo.exe | Select-Object -First 1
          if (-not $mhExe) { throw 'mihomo.exe not found inside the release archive' }
          Copy-Item $mhExe.FullName cores/windows-x64/mihomo.exe
          Get-ChildItem cores/windows-x64

      - name: Stage + zip
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $stage = "stage/Atlanhix-v$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/windows/x64/runner/Release/* $stage -Recurse -Force
          # engines ride INSIDE the bundle so a zip-only install just works
          # (BinaryManager searches ./cores relative to the working dir)
          if (Test-Path cores) {
            Copy-Item cores $stage -Recurse -Force
          } else {
            Write-Warning 'no cores/ dir — shipping the zip without bundled engines'
          }
          Compress-Archive -Path $stage -DestinationPath "Atlanhix-v$ver-windows-x64.zip" -Force
          Get-Item "Atlanhix-v$ver-windows-x64.zip" | Select-Object Name, Length

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Atlanhix-*-windows-x64.zip
          fail_on_unmatched_files: true

  # v0.6.3 §release-parity: Linux is a first-class desktop target now — the
  # same bundle layout as Windows (app + cores/<platform>-<arch>), zipped as
  # a .tar.gz. The Dart side picks it up automatically: UpdateChecker resolves
  # Atlanhix-v*-linux-x64.tar.gz for TargetPlatform.linux, the in-app updater
  # streams it into ~/Downloads and reveals it in the file manager, and
  # BinaryManager looks in cores/linux-x64 (Platform.operatingSystem+arch).
  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libjsoncpp-dev
          # tray_manager/window_manager need an appindicator dev package; the
          # name differs across Ubuntu releases (ayatana on 22.04+/24.04).
          sudo apt-get install -y libayatana-appindicator3-dev || \
            sudo apt-get install -y libappindicator3-dev || true

      - name: Set up Flutter (version pinned to the dev toolchain)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Download core engines (official releases)
        # v0.6.3 §ci-fix: same policy as the Windows job — a missing engine
        # warns loudly and the tarball still ships.
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p cores/linux-x64 tmp-cores
          # sing-box (same pinned version as the Windows job)
          curl -fsSL -o tmp-cores/sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz
          tar -xzf tmp-cores/sb.tar.gz -C tmp-cores
          cp "$(find tmp-cores -type f -name sing-box | head -n1)" cores/linux-x64/sing-box
          # Xray
          curl -fsSL -o tmp-cores/xr.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          unzip -o -q tmp-cores/xr.zip -d tmp-cores/xr
          cp "$(find tmp-cores/xr -type f -name xray | head -n1)" cores/linux-x64/xray
          # mihomo — resolve the newest asset by NAME (never a pinned URL: the
          # Windows job learned that lesson in v0.5.6) and accept either the
          # .zip or the .gz packaging upstream switches between.
          assets="$(curl -fsSL -H 'User-Agent: atlanhix-release' \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          url="$(printf '%s' "$assets" | \
            grep -o 'https://[^"]*mihomo-linux-amd64-v[0-9.]*\.\(zip\|gz\)' | head -n1)"
          if [ -z "$url" ]; then echo 'no mihomo linux-amd64 asset'; exit 1; fi
          echo "mihomo -> $url"
          case "$url" in
            *.zip)
              curl -fsSL -o tmp-cores/mh.zip "$url"
              unzip -o -q tmp-cores/mh.zip -d tmp-cores/mh
              ;;
            *.gz)
              curl -fsSL -o tmp-cores/mihomo.gz "$url"
              gunzip -f tmp-cores/mihomo.gz
              mkdir -p tmp-cores/mh
              mv tmp-cores/mihomo tmp-cores/mh/mihomo
              ;;
          esac
          cp "$(find tmp-cores/mh -type f -name mihomo | head -n1)" cores/linux-x64/mihomo
          chmod +x cores/linux-x64/*
          ls -la cores/linux-x64

      - name: Stage + tarball
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="stage/Atlanhix-v$VER"
          mkdir -p "$STAGE"
          cp -r build/linux/x64/release/bundle/. "$STAGE/"
          # engines ride INSIDE the bundle so an untar-only install just works
          if [ -d cores ]; then
            cp -r cores "$STAGE/"
          else
            echo '::warning::no cores/ dir — shipping the tarball without bundled engines'
          fi
          tar -czf "Atlanhix-v$VER-linux-x64.tar.gz" -C stage "Atlanhix-v$VER"
          ls -la Atlanhix-*-linux-x64.tar.gz

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Atlanhix-*-linux-x64.tar.gz
          fail_on_unmatched_files: true
