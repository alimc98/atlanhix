name: nexus
description: Atlanhix — production-grade cross-platform proxy/VPN client (Windows, Linux, Android).
publish_to: "none"
license: MIT
# v0.6.14 §release-fix: versionCode MUST outrank every previously shipped
# build. `flutter build apk --split-per-abi` (the CI release path) adds
# 1000 * ABI to the pubspec code, so v0.6.12+27 shipped as 2027 for arm64 —
# and v0.6.13 was built from that same +27, shipping an APK that still said
# "0.6.12" with versionCode 2027 (installs refused as "App not installed",
# in-app updates never detected). 2029 is above 2028 for the universal build;
# the split builds land at 2029/3029.
version: 0.6.14+2029

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  yaml: ^3.1.3
  intl: any
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  qr_flutter: ^4.1.0
  window_manager: ^0.4.3
  tray_manager: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/intro/
    - assets/brand/
    - assets/shaders/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # v0.4.7 §brand: Montserrat — the logotype face. Latin text renders in
    # it so headlines/labels echo the ATLANHIX lettering (wide, geometric).
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
