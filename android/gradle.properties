# v0.5.0 §build: this machine has 5 GB RAM — the old 8G heap + 4G
# metaspace targets made the Kotlin daemon fail to spawn ("Failed
# connecting to the daemon in 4 retries"). Sized for an 5 GB box.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin daemon: smaller footprint than the Gradle one, and fall back to
# in-process compilation if it cannot start instead of failing the build.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.daemon.enabled=true
# v0.6.3 §ci-fix: the Kotlin daemon needs its own JVM, and when it cannot
# spawn the whole build dies with "Failed connecting to the daemon in 4
# retries" — the exact failure the -Xmx note above was already fighting, and
# one this machine reproduced (building the release APK). The comment above
# SAYS "fall back to in-process compilation", but nothing did. This is that
# fallback: compile in the Gradle daemon's JVM, no second process to spawn.
# For a Kotlin module this small the wall time is the same and the failure
# mode disappears.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# v0.6.3 §ci-fix: `org.gradle.offline=true` was REMOVED from this committed
# file (it used to live here as a v0.4 workaround for dl.google.com 404ing the
# AGP lint jars on one flaky network). This file is read by CI too, and on a
# FRESH runner there is no warm Gradle cache to run offline against — that is
# how "it builds on my machine" turns into a red release job with nothing to
# download. Machine-local settings belong in android/gradle.properties.local
# (gitignored); for a flaky network use `./gradlew --offline` on the command
# line instead of baking it in here.

# v0.4.1 debug-loop fix: wedged daemons caused multi-hour hangs
org.gradle.daemon=true

# v0.5.0 §CI-fix: NO org.gradle.java.home here anymore. The two conflicting
# machine-specific pins (Studio JBR = JDK 25 vs Temurin 17) broke the CI
# build ("Value 'C:/Users/Hosna/dev-tools/jdk-17' ... is invalid"). The JVM
# is resolved per-machine from android/gradle.properties.local (gitignored;
# see gradle.properties.local.example) or falls back to JAVA_HOME.
