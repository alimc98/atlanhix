# v0.5.0 §build: this machine has 5 GB RAM — the old 8G heap + 4G
# metaspace targets made the Kotlin daemon fail to spawn ("Failed
# connecting to the daemon in 4 retries"). Sized for an 5 GB box.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin daemon: smaller footprint than the Gradle one, and fall back to
# in-process compilation if it cannot start instead of failing the build.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.daemon.enabled=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# v0.4: Android Studio's bundled JBR (JDK 25). The system PATH java is 1.8,
# which Gradle 9.3 rejects — pin the daemon JVM explicitly.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# v0.4: dl.google.com 404s the AGP lint-toolchain jars on this network and its
# detached configurations ignore mirror overrides. All dependencies are already
# in the local modules cache (sha1-verified) — run fully offline so resolution
# never touches the flaky host. Remove this line to re-enable downloads.
org.gradle.offline=true

# v0.4.1 debug-loop fix: wedged daemons caused multi-hour hangs
org.gradle.daemon=true

# Kotlin 2.2 analysis loop hangs on JDK 25 (JBR); pin Gradle to Temurin 17
org.gradle.java.home=C\:/Users/Hosna/dev-tools/jdk-17
